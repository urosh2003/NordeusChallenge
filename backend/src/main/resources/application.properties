spring.application.name=backend
api.base-path=/api

spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Drools rule-engine tracing. Set to false to silence the per-turn rule-firing logs.
ai.drools.log-events=true
# Verbosity of the Drools logger (FIRED / INSERT / UPDATE / DELETE lines).
# INFO = show all events, WARN = show only warnings, DEBUG = even more detail.
logging.level.AI.Drools=INFO